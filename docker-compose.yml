services:
  postgres:
    image: postgres:15-alpine
    container_name: ner_postgres
    environment:
      POSTGRES_USER: ner_user
      POSTGRES_PASSWORD: ner_password
      POSTGRES_DB: ner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner_user -d ner_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: ner_minio
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ner_api_gateway
    environment:
      - DOCUMENT_SERVICE_URL=http://document-service:8001
      - NER_SERVICE_URL=http://ner-service:8002
      - MASKING_SERVICE_URL=http://masking-service:8003
      - ENTITY_DICT_SERVICE_URL=http://entity-dictionary-service:8004
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./api-gateway:/app

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: ner_document_service
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_user
      - MINIO_SECRET_KEY=minio_password
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "8001:8001"
    depends_on:
      - minio
      - redis
    volumes:
      - ./document-service:/app

  ner-service:
    build:
      context: ./ner-service
      dockerfile: Dockerfile
    container_name: ner_ner_service
    environment:
      - ENTITY_DICT_SERVICE_URL=http://entity-dictionary-service:8004
      - REDIS_URL=redis://redis:6379/2
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - entity-dictionary-service
    volumes:
      - ./ner-service:/app

  masking-service:
    build:
      context: ./masking-service
      dockerfile: Dockerfile
    container_name: ner_masking_service
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_user
      - MINIO_SECRET_KEY=minio_password
      - REDIS_URL=redis://redis:6379/3
    ports:
      - "8003:8003"
    depends_on:
      - minio
      - redis
    volumes:
      - ./masking-service:/app

  entity-dictionary-service:
    build:
      context: ./entity-dictionary-service
      dockerfile: Dockerfile
    container_name: ner_entity_dictionary_service
    environment:
      - DATABASE_URL=postgresql://ner_user:ner_password@postgres:5432/ner_db
      - REDIS_URL=redis://redis:6379/4
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./entity-dictionary-service:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
